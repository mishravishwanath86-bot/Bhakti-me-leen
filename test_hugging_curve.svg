<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="700" height="112" style="background:#200738; padding:20px;">
  <defs>
    <!-- Reflective Glass Gradient for Base Bar -->
    <linearGradient id="baseReflectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(55, 38, 85, 0.75)"/>
      <stop offset="25%" stop-color="rgba(35, 24, 60, 0.85)"/>
      <stop offset="50%" stop-color="rgba(70, 48, 105, 0.70)"/>
      <stop offset="75%" stop-color="rgba(25, 18, 45, 0.90)"/>
      <stop offset="100%" stop-color="rgba(15, 10, 28, 0.95)"/>
    </linearGradient>

    <!-- Reflective Specular Glass Stroke -->
    <linearGradient id="baseStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)"/>
      <stop offset="20%" stop-color="rgba(248, 200, 59, 0.60)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.80)"/>
      <stop offset="80%" stop-color="rgba(248, 200, 59, 0.50)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.35)"/>
    </linearGradient>

    <!-- Golden Reflection Glass for Active Circle -->
    <linearGradient id="goldGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="20%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Base Bar with Reflective Glass Fill & Highlight -->
  <path d="M 0,36 A 36,36 0 0 1 36,0 L 84.0,0 C 112.0,0 122.0,96 160.0,96 C 198.0,96 208.0,0 236.0,0 L 964,0 A 36,36 0 0 1 1000,36 L 1000,124 A 36,36 0 0 1 964,160 L 36,160 A 36,36 0 0 1 0,124 Z" fill="url(#baseReflectGrad)" stroke="url(#baseStrokeGrad)" stroke-width="2.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>

  <!-- Golden Glass Active Circle: exactly sits inside the hugging cradle -->
  <circle cx="160.0" cy="31" r="63.5" fill="url(#goldGlassGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" filter="drop-shadow(0 8px 20px rgba(245,158,11,0.65))"/>
</svg>