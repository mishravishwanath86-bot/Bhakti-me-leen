<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curved Glass Nav Test - Clearance & Deep Curve</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #3b0764 0%, #1e1b4b 50%, #09090b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
    }

    .dock-wrap {
      position: relative;
      width: 420px;
      height: 70px;
      z-index: 100;
      filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 15px rgba(248, 200, 59, 0.15));
    }

    .dock-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .dock-path {
      fill: rgba(22, 17, 36, 0.82);
      stroke: rgba(255, 255, 255, 0.22);
      stroke-width: 1.8;
      transition: d 0.38s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .dock-bubble {
      position: absolute;
      top: -24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
      box-shadow: 0 10px 28px rgba(34, 197, 94, 0.65), 0 0 15px rgba(34, 197, 94, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-50%);
      transition: left 0.38s cubic-bezier(0.34, 1.4, 0.64, 1);
      z-index: 10;
      pointer-events: none;
    }

    .dock-bubble svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #0A0A10;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dock-items {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      box-sizing: border-box;
      padding: 0 6%; /* Matches margin_x = 60 in 1000 viewBox! */
      z-index: 5;
    }

    .dock-btn {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #94A3B8;
      -webkit-tap-highlight-color: transparent;
    }

    .dock-btn svg {
      width: 23px;
      height: 23px;
      stroke: #A1A1AA;
      stroke-width: 2;
      fill: none;
      transition: all 0.25s ease;
    }

    .dock-btn.active svg {
      opacity: 0;
      transform: translateY(-8px) scale(0.5);
    }

    .dock-btn span {
      font-size: 0.62rem;
      font-weight: 600;
      margin-top: 3px;
      color: #9CA3AF;
      transition: all 0.25s ease;
    }

    .dock-btn.active span {
      color: #22C55E;
      font-weight: 800;
      transform: translateY(4px);
    }
  </style>
</head>
<body>

  <div class="dock-wrap">
    <svg class="dock-svg" viewBox="0 0 1000 160" preserveAspectRatio="none">
      <defs>
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(34, 26, 54, 0.78)"/>
          <stop offset="100%" stop-color="rgba(16, 12, 28, 0.92)"/>
        </linearGradient>
      </defs>
      <path id="glass-path" class="dock-path" fill="url(#glassGradient)" d="" />
    </svg>

    <div class="dock-bubble" id="bubble">
      <div id="bubble-icon"></div>
    </div>

    <div class="dock-items">
      <button class="dock-btn active" onclick="setTab(0)">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5v9.5a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9.5z"/></svg>
        <span>होम</span>
      </button>
      <button class="dock-btn" onclick="setTab(1)">
        <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>
        <span>ऑडियो</span>
      </button>
      <button class="dock-btn" onclick="setTab(2)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2 3"/><circle cx="12" cy="4" r="1.8" fill="currentColor"/><circle cx="12" cy="20" r="1.8" fill="currentColor"/><circle cx="4" cy="12" r="1.8" fill="currentColor"/><circle cx="20" cy="12" r="1.8" fill="currentColor"/><circle cx="6.5" cy="6.5" r="1.8" fill="currentColor"/><circle cx="17.5" cy="6.5" r="1.8" fill="currentColor"/></svg>
        <span>जाप माला</span>
      </button>
      <button class="dock-btn" onclick="setTab(3)">
        <svg viewBox="0 0 24 24"><path d="M12 2c0 3.5-3.5 5.5-3.5 9a3.5 3.5 0 007 0c0-3.5-3.5-5.5-3.5-9z"/><path d="M4 17c0 3 4 5 8 5s8-2 8-5H4z"/></svg>
        <span>आरती</span>
      </button>
      <button class="dock-btn" onclick="setTab(4)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="2"/></svg>
        <span>पंचांग</span>
      </button>
    </div>
  </div>

  <script>
    const ICONS = [
      '<svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5v9.5a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1v-9.5z"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0118 0v6"/><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>',
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2 3"/><circle cx="12" cy="4" r="1.8" fill="currentColor"/><circle cx="12" cy="20" r="1.8" fill="currentColor"/><circle cx="4" cy="12" r="1.8" fill="currentColor"/><circle cx="20" cy="12" r="1.8" fill="currentColor"/><circle cx="6.5" cy="6.5" r="1.8" fill="currentColor"/><circle cx="17.5" cy="6.5" r="1.8" fill="currentColor"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M12 2c0 3.5-3.5 5.5-3.5 9a3.5 3.5 0 007 0c0-3.5-3.5-5.5-3.5-9z"/><path d="M4 17c0 3 4 5 8 5s8-2 8-5H4z"/></svg>',
      '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="15" r="2"/></svg>'
    ];

    const VIEW_W = 1000;
    const VIEW_H = 160;
    const MARGIN_X = 60;
    const USABLE_W = VIEW_W - 2 * MARGIN_X; // 880
    const TOTAL_TABS = 5;
    const TAB_W = USABLE_W / TOTAL_TABS; // 176
    const CORNER_R = 36;

    // Deep, prominent, unmistakable scoop curve like Image 2!
    const SCOOP_HALF_W = 70;
    const DEPTH = 86;
    const SHOULDER_W = 28;

    function getCurvedPath(cx) {
      const leftX = cx - SCOOP_HALF_W;
      const rightX = cx + SCOOP_HALF_W;

      return `M 0,${CORNER_R} ` +
             `A ${CORNER_R},${CORNER_R} 0 0 1 ${CORNER_R},0 ` +
             `L ${leftX.toFixed(1)},0 ` +
             `C ${(leftX + SHOULDER_W).toFixed(1)},0 ${(cx - 40).toFixed(1)},${DEPTH} ${cx.toFixed(1)},${DEPTH} ` +
             `C ${(cx + 40).toFixed(1)},${DEPTH} ${(rightX - SHOULDER_W).toFixed(1)},0 ${rightX.toFixed(1)},0 ` +
             `L ${VIEW_W - CORNER_R},0 ` +
             `A ${CORNER_R},${CORNER_R} 0 0 1 ${VIEW_W},${CORNER_R} ` +
             `L ${VIEW_W},${VIEW_H - CORNER_R} ` +
             `A ${CORNER_R},${CORNER_R} 0 0 1 ${VIEW_W - CORNER_R},${VIEW_H} ` +
             `L ${CORNER_R},${VIEW_H} ` +
             `A ${CORNER_R},${CORNER_R} 0 0 1 0,${VIEW_H - CORNER_R} ` +
             `Z`;
    }

    function setTab(idx) {
      const pathEl = document.getElementById('glass-path');
      const bubble = document.getElementById('bubble');
      const iconWrap = document.getElementById('bubble-icon');
      const btns = document.querySelectorAll('.dock-btn');

      btns.forEach((b, i) => b.classList.toggle('active', i === idx));

      const cx = MARGIN_X + (idx + 0.5) * TAB_W;
      pathEl.setAttribute('d', getCurvedPath(cx));

      // Bubble position as percent of width (cx / VIEW_W * 100)
      bubble.style.left = `${(cx / VIEW_W * 100).toFixed(2)}%`;
      iconWrap.innerHTML = ICONS[idx];
    }

    setTab(0);
  </script>
</body>
</html>
